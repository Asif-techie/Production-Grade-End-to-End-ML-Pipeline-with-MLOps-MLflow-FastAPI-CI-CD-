apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  labels:
    app: heart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      containers:
        - name: heart-api
          image: asiftech67/heart-api:latest   # CI/CD pipeline pushes this image
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: MODEL_PATH
              value: "models/LogisticRegression.pkl"  # Matches Dockerfile ENV
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api-service
spec:
  selector:
    app: heart-api
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80