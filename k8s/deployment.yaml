apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  labels:
    app: heart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      containers:
        - name: heart-api
          image: asiftech67/heart-api:latest
          ports:
            - containerPort: 80
          env:
            - name: MLFLOW_TRACKING_URI
              value: "file:///mlruns"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
