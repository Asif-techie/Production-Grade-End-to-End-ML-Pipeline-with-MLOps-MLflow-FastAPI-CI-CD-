apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      containers:
        - name: heart-api
          image: asiftech67/heart-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: MODEL_PATH
              value: "/app/models/LogisticRegression.pkl"
            - name: MLFLOW_TRACKING_URI
              value: "file:///mlruns"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api-service
spec:
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - port: 80
      targetPort: 80
