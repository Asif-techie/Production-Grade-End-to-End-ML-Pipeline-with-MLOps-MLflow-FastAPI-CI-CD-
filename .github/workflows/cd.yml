name: CD - Build & Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ secrets.ACR_NAME }}.azurecr.io/heart-api:latest .

    - name: Push Docker image
      run: |
        docker push \
          ${{ secrets.ACR_NAME }}.azurecr.io/heart-api:latest

    - name: Deploy to Azure App Service
      run: |
        az webapp config container set \
          --name ${{ secrets.APP_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --docker-custom-image-name ${{ secrets.ACR_NAME }}.azurecr.io/heart-api:latest \
          --docker-registry-server-url https://${{ secrets.ACR_NAME }}.azurecr.io
