name: Heart Disease CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_EXPERIMENT_NAME: HeartDisease_CI_CD
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  MODEL_PATH: "models"

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLflow Training
        run: |
          mlflow run . --no-conda
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: HeartDisease_CI_CD

      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns/

  docker-build-and-test:
    runs-on: ubuntu-latest
    needs: build-and-train
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download MLflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlflow-artifacts
          path: ./mlruns

      - name: Copy trained models
        run: |
          mkdir -p models
          cp mlruns/*/artifacts/*/*.pkl models/ || echo "No models found"

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/heart-api:latest .

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/heart-api:latest

      - name: Test Docker container locally
        run: |
          docker run -d --name heart-api-test -p 8000:80 ${{ secrets.DOCKER_USERNAME }}/heart-api:latest
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health) || true
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check passed"
              break
            else
              echo "⏳ Waiting for container to be ready..."
              sleep 5
            fi
          done
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"instances": [[63,1,3,145,233,1,0,150,0,2.3,0,0,1]]}')
          echo "Predict response: $RESPONSE"
          docker stop heart-api-test
          docker rm heart-api-test

  deploy-to-aks:
    runs-on: ubuntu-latest
    needs: docker-build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure AKS
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/heart-api --timeout=180s
