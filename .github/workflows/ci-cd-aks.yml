name: Heart Disease CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  MLFLOW_EXPERIMENT_NAME: HeartDisease_CI_CD
  MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

# =====================================================
# 1️⃣ TRAIN + LOG MODEL
# =====================================================
jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow joblib scikit-learn pandas

      - name: Run training (direct python – NO mlflow run)
        run: |
          mkdir -p mlruns models
          python src/train.py

      - name: Verify outputs
        run: |
          echo "🔍 mlruns:"
          ls -R mlruns || true
          echo "🔍 models:"
          ls -R models || true

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/

# =====================================================
# 2️⃣ DOCKER BUILD + TEST
# =====================================================
  docker:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_USERNAME/heart-api:latest .

      - name: Test Docker container (robust)
        run: |
          docker run -d --name heart-test -p 8000:80 \
            -e MODEL_PATH=models/LogisticRegression.pkl \
            $DOCKER_USERNAME/heart-api:latest

          echo "⏳ Waiting for API readiness..."

          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API is healthy"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 3
          done

          if [ "$STATUS" != "200" ]; then
            echo "❌ API failed to start"
            docker logs heart-test
            exit 1
          fi

          echo "🔍 Testing prediction endpoint"
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"instances":[[63,1,3,145,233,1,0,150,0,2.3,0,0,1]]}'

          docker logs heart-test
          docker stop heart-test
          docker rm heart-test

      - name: Push Docker image
        run: |
          docker push $DOCKER_USERNAME/heart-api:latest

# =====================================================
# 3️⃣ DEPLOY TO AKS
# =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/heart-api --timeout=180s
