name: Heart Disease CI/CD + Monitoring Verification

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  MLFLOW_EXPERIMENT_NAME: HeartDisease_CI_CD
  MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # ------------------------
  # 1️⃣ TRAIN MODEL
  # ------------------------
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow joblib prometheus-fastapi-instrumentator httpx

      - name: Train model
        run: python src/train.py

      - name: Verify artifacts
        run: |
          ls -R mlruns || true
          ls -R models || true

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/

  # ------------------------
  # 2️⃣ BUILD & TEST DOCKER
  # ------------------------
  docker:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models/

      - name: Verify model exists
        run: test -f models/model.pkl

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $DOCKER_USERNAME/heart-api:latest .

      - name: Run container in CI
        run: |
          docker run -d --name heart-test -p 8000:8000 $DOCKER_USERNAME/heart-api:latest
          echo "⏳ Waiting 25s for FastAPI to start and load model..."
          sleep 25
          echo "📝 Container logs:"
          docker logs heart-test || true

      - name: Verify /health endpoint
        run: curl -f http://localhost:8000/health

      - name: Verify /metrics endpoint
        run: curl -f http://localhost:8000/metrics | grep http_requests_total || true

      - name: Verify /predict endpoint
        run: |
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"instances": [[60,1,3,130,250,0,1,150,0,1.2,2,0,2]]}'

      - name: Stop & remove container
        run: |
          docker stop heart-test
          docker rm heart-test

      - name: Push Docker image
        run: docker push $DOCKER_USERNAME/heart-api:latest

  # ------------------------
  # 3️⃣ DEPLOY TO AKS
  # ------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Write kubeconfig
        run: |
          cat <<'EOF' > kubeconfig
          ${{ secrets.AKS_KUBECONFIG }}
          EOF
          chmod 600 kubeconfig

      - name: Verify Kubernetes context
        run: |
          kubectl --kubeconfig=$PWD/kubeconfig config get-contexts
          kubectl --kubeconfig=$PWD/kubeconfig config current-context

      - name: Verify cluster access
        run: kubectl --kubeconfig=$PWD/kubeconfig get nodes

      - name: Deploy Heart API & Monitoring stack
        run: |
          kubectl --kubeconfig=$PWD/kubeconfig create namespace monitoring || true
          kubectl --kubeconfig=$PWD/kubeconfig apply -f k8s/ --validate=false
          kubectl --kubeconfig=$PWD/kubeconfig rollout status deployment/heart-api --timeout=180s
          kubectl --kubeconfig=$PWD/kubeconfig rollout status deployment/prometheus --namespace monitoring --timeout=180s
          kubectl --kubeconfig=$PWD/kubeconfig rollout status deployment/grafana --namespace monitoring --timeout=180s

      - name: Verify Heart API service
        run: kubectl --kubeconfig=$PWD/kubeconfig get svc heart-api-service

      - name: Port-forward Heart API for tests
        run: kubectl --kubeconfig=$PWD/kubeconfig port-forward svc/heart-api-service 8000:80 & sleep 10

      - name: Verify /health endpoint on AKS
        run: curl -f http://localhost:8000/health

      - name: Verify /metrics endpoint on AKS
        run: curl -f http://localhost:8000/metrics | grep http_requests_total || true

      - name: Verify /predict endpoint on AKS
        run: |
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"instances": [[60,1,3,130,250,0,1,150,0,1.2,2,0,2]]}'

      - name: Port-forward Prometheus for verification
        run: kubectl --kubeconfig=$PWD/kubeconfig -n monitoring port-forward svc/prometheus 9090:9090 & sleep 5

      - name: Verify Prometheus metrics
        run: curl -s http://localhost:9090/metrics | grep heart_api || true

      - name: Port-forward Grafana for verification
        run: kubectl --kubeconfig=$PWD/kubeconfig -n monitoring port-forward svc/grafana 3000:80 & sleep 5

      - name: Grafana login info
        run: echo "Grafana is available at http://localhost:3000 with user=admin / pass=admin123"
