name: CI/CD - Heart API to AKS

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: asiftech67/heart-api
      MODEL_PATH: models/LogisticRegression.pkl
      K8S_MANIFEST: k8s/deployment.yaml

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3️⃣ Install dependencies for training (optional if CI trains model)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4️⃣ Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5️⃣ Build Docker image
    - name: Build Docker image
      run: |
        docker build -t $IMAGE_NAME:latest .

    # 6️⃣ Push Docker image
    - name: Push Docker image
      run: |
        docker push $IMAGE_NAME:latest

    # 7️⃣ Set up kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.30.0'

    # 8️⃣ Configure AKS credentials
  

    # 9️⃣ Deploy to AKS
    - name: Deploy to AKS
      run: |
        kubectl apply -f $K8S_MANIFEST --validate=false
        kubectl rollout status deployment/heart-api
        kubectl get pods -l app=heart-api