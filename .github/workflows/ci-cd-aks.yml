name: Heart Disease CI/CD + Monitoring Verification

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  MLFLOW_EXPERIMENT_NAME: HeartDisease_CI_CD
  MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # ------------------------
  # 1️⃣ TRAIN MODEL
  # ------------------------
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow joblib prometheus-fastapi-instrumentator httpx

      - name: Train model
        run: python src/train.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/

  # ------------------------
  # 2️⃣ BUILD & RUN CONTAINER + VERIFY MONITORING
  # ------------------------
  monitor-test:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models/

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $DOCKER_USERNAME/heart-api:latest .

      - name: Run container in CI
        run: |
          docker run -d --name heart-test -p 8000:8000 $DOCKER_USERNAME/heart-api:latest
          sleep 20

      - name: Verify /health endpoint
        run: |
          curl -f http://localhost:8000/health

      - name: Verify Prometheus metrics exposed
        run: |
          curl -f http://localhost:8000/metrics | grep "http_requests_total"

      - name: Test /predict endpoint
        run: |
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":60,"sex":1,"cp":3,"trestbps":130,"chol":250,"fbs":0,"restecg":1,"thalach":150,"exang":0,"oldpeak":1.2,"slope":2,"ca":0,"thal":2}'

      - name: Stop and remove container
        run: |
          docker stop heart-test
          docker rm heart-test

  # ------------------------
  # 3️⃣ DEPLOY TO AKS
  # ------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: monitor-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Write kubeconfig
        run: |
          cat <<'EOF' > kubeconfig
          ${{ secrets.AKS_KUBECONFIG }}
          EOF
          chmod 600 kubeconfig

      - name: Deploy to AKS
        run: |
          kubectl --kubeconfig=$PWD/kubeconfig apply -f k8s/ --validate=false
          kubectl --kubeconfig=$PWD/kubeconfig rollout status deployment/heart-api --timeout=180s
