name: CI/CD - Heart API to AKS

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  train-build-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: asiftech67/heart-api
      MODEL_NAME: RandomForest.pkl          # <-- Update model here if needed
      MODEL_DIR: models
      MODEL_PATH: models/RandomForest.pkl
      K8S_MANIFEST: k8s/deployment.yaml

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4️⃣ Run training script
    - name: Train Models
      run: |
        python src/train.py
        ls -l $MODEL_DIR

    # 5️⃣ Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 6️⃣ Build Docker image
    - name: Build Docker image
      run: |
        docker build \
          --build-arg MODEL_DIR=$MODEL_DIR \
          --build-arg MODEL_NAME=$MODEL_NAME \
          -t $IMAGE_NAME:latest .

    # 7️⃣ Push Docker image
    - name: Push Docker image
      run: |
        docker push $IMAGE_NAME:latest

    # 8️⃣ Set up kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.30.0'

    # 9️⃣ Configure AKS credentials
    - name: Set AKS credentials
      uses: azure/aks-set-context@v3
      with:
        creds: ${{ secrets.AKS_KUBECONFIG }}
        cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
        resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}

    # 🔟 Deploy to AKS
    - name: Deploy to AKS
      run: |
        kubectl apply -f $K8S_MANIFEST --validate=false
        kubectl rollout status deployment/heart-api
        kubectl get pods -l app=heart-api
