name: CI/CD - Heart API to AKS

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  train-build-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: asiftech67/heart-api
      MODEL_NAME: LogisticRegression.pkl
      K8S_MANIFEST: k8s/deployment.yaml
      MODEL_DIR: models

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4️⃣ Train model (optional if already trained)
    - name: Train model
      run: |
        mkdir -p $MODEL_DIR
        python src/train.py

    # 5️⃣ Verify model exists
    - name: Check trained model
      run: |
        ls -l $MODEL_DIR/$MODEL_NAME

    # 6️⃣ Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 7️⃣ Build Docker image
    - name: Build Docker image
      run: |
        docker build -t $IMAGE_NAME:latest .

    # 8️⃣ Push Docker image
    - name: Push Docker image
      run: |
        docker push $IMAGE_NAME:latest

    # 9️⃣ Setup kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.30.0'

    # 🔟 Write kubeconfig from secret
    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.AKS_KUBECONFIG }}" > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        kubectl config get-contexts
        kubectl config current-context

    # 1️⃣1️⃣ Deploy to AKS
    - name: Deploy to AKS
      run: |
        export KUBECONFIG=$PWD/kubeconfig
        kubectl apply -f $K8S_MANIFEST --validate=false
        kubectl rollout status deployment/heart-api
        kubectl get pods -l app=heart-api
