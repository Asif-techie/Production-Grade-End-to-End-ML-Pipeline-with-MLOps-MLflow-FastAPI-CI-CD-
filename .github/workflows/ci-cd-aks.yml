name: CI/CD - Heart API + AKS

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: "${{ secrets.MLFLOW_TRACKING_URI }}"
      DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
      DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}"
      KUBECONFIG: "${{ secrets.KUBECONFIG }}"

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Lint code
      - name: Lint
        run: flake8 src tests --count --exit-zero --max-line-length=120 --statistics

      # 5️⃣ Run unit tests
      - name: Unit Tests
        run: pytest -v

      # 6️⃣ Train model
      - name: Train Model
        run: python src/train.py

      # 7️⃣ Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      # 8️⃣ Build & push Docker image
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: "${{ secrets.DOCKER_USERNAME }}/heart-api:latest"
          file: ./Dockerfile

      # 9️⃣ Test Docker container locally (before AKS)
      - name: Test Docker Container
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/heart-api:latest"

          # Run container in background
          docker run -d --name heart-api-test -p 8000:80 "$IMAGE"

          # Wait for API to become healthy (retry up to 10 times)
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check passed"
              break
            fi
            echo "Waiting for API to start... attempt $i"
            sleep 3
          done

          # If still not healthy, print logs and fail
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed"
            docker logs heart-api-test
            docker stop heart-api-test
            docker rm heart-api-test
            exit 1
          fi

          # Test predict endpoint with dummy input
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"instances": [[63,1,3,145,233,1,0,150,0,2.3,0,0,1]]}')
          echo "Predict response: $RESPONSE"

          # Stop and remove container
          docker stop heart-api-test
          docker rm heart-api-test

      # 🔟 Setup kubectl
      - name: Setup kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
          export KUBECONFIG=kubeconfig
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # 1️⃣1️⃣ Deploy to AKS
      - name: Deploy to AKS
        run: |
          kubectl set image deployment/heart-api heart-api="${{ secrets.DOCKER_USERNAME }}/heart-api:latest"
          kubectl rollout status deployment/heart-api