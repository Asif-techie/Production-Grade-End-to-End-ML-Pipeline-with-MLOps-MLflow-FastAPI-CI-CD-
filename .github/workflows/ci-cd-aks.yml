name: CI/CD - Heart API + AKS

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: "${{ secrets.MLFLOW_TRACKING_URI }}"
      DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
      DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}"
      KUBECONFIG: "${{ secrets.KUBECONFIG }}"

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Lint code
      - name: Lint
        run: flake8 src tests --count --exit-zero --max-line-length=120 --statistics

      # 5️⃣ Run unit tests
      - name: Unit Tests
        run: pytest -v

      # 6️⃣ Train model with MLflow logging
      - name: Train Model & Log MLflow
        run: |
          mkdir -p mlruns
          mlflow experiments create --experiment-name "HeartDisease_CI_CD" || echo "Experiment exists"
          mlflow run src --entry-point train.py --experiment-name HeartDisease_CI_CD
          # Ensure model folder exists for Docker
          mkdir -p src/models
          mv models/LogisticRegression.pkl src/models/
          ls -la src/models/

      # 7️⃣ Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      # 8️⃣ Build & push Docker image
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/heart-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/heart-api:latest

      # 9️⃣ Test Docker container locally & save artifacts
      - name: Test Docker Container & Save Artifacts
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/heart-api:latest"
          mkdir -p container_logs
          
          # Run container
          docker run -d --name heart-api-test -p 8000:80 "$IMAGE"
          
          # Wait for API to start
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check passed"
              break
            fi
            echo "Waiting for API... attempt $i"
            sleep 3
          done
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed"
            docker logs heart-api-test | tee container_logs/heart-api.log
            docker stop heart-api-test
            docker rm heart-api-test
            exit 1
          fi
          
          # Test predict endpoint
          curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"instances": [[63,1,3,145,233,1,0,150,0,2.3,0,0,1]]}' \
            | tee container_logs/predict_response.json
          
          # Save container logs
          docker logs heart-api-test | tee container_logs/heart-api.log
          
          # Stop & remove container
          docker stop heart-api-test
          docker rm heart-api-test
          
        # Save artifacts
      - name: Upload Container Logs & Predictions
        uses: actions/upload-artifact@v3
        with:
          name: container-artifacts
          path: container_logs/

      # 🔟 Setup kubectl
      - name: Setup kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
          export KUBECONFIG=kubeconfig
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # 1️⃣1️⃣ Deploy to AKS
      - name: Deploy to AKS
        run: |
          kubectl set image deployment/heart-api heart-api="${{ secrets.DOCKER_USERNAME }}/heart-api:latest"
          kubectl rollout status deployment/heart-api
