name: Heart Disease CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  MLFLOW_EXPERIMENT_NAME: HeartDisease_CI_CD
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow

      - name: Run MLflow Training (NO conda / NO venv)
        env:
          MLFLOW_TRACKING_URI: file:///tmp/mlruns
        run: |
          python src/train.py

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

  docker:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download MLflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlruns
          path: mlruns

      - name: Extract model artifacts
        run: |
          mkdir -p models
          find mlruns -name "*.pkl" -exec cp {} models/ \;

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/heart-api:latest .

      - name: Test container locally
        run: |
          docker run -d -p 8000:80 --name heart-test ${{ secrets.DOCKER_USERNAME }}/heart-api:latest
          sleep 10
          curl http://localhost:8000/health
          docker logs heart-test
          docker stop heart-test
          docker rm heart-test

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/heart-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/heart-api --timeout=180s