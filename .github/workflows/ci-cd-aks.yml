name: Heart Disease CI/CD + Monitoring Verification

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  MLFLOW_EXPERIMENT_NAME: HeartDisease_CI_CD
  MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
# =====================================================
# 1️⃣ TRAIN MODEL
# =====================================================
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow joblib prometheus-fastapi-instrumentator httpx

      - name: Train model
        run: python src/train.py

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/

# =====================================================
# 2️⃣ BUILD, TEST & PUSH DOCKER
# =====================================================
  docker:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models/

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $DOCKER_USERNAME/heart-api:latest .

      - name: Run container for tests
        run: |
          docker run -d -p 8000:8000 --name heart-test $DOCKER_USERNAME/heart-api:latest
          sleep 25

      - name: Verify /health
        run: curl -f http://localhost:8000/health

      - name: Verify /metrics
        run: curl -f http://localhost:8000/metrics | grep http_requests_total

      - name: Verify /predict
        run: |
          curl -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"instances": [[60,1,3,130,250,0,1,150,0,1.2,2,0,2]]}'

      - name: Cleanup container
        run: |
          docker stop heart-test
          docker rm heart-test

      - name: Push Docker image
        run: docker push $DOCKER_USERNAME/heart-api:latest

# =====================================================
# 3️⃣ DEPLOY & VERIFY ON AKS
# =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Write kubeconfig
        run: |
          echo "${{ secrets.AKS_KUBECONFIG }}" > kubeconfig
          chmod 600 kubeconfig

      - name: Create monitoring namespace
        run: kubectl --kubeconfig=kubeconfig create namespace monitoring || true

      - name: Deploy Kubernetes manifests
        run: |
          kubectl --kubeconfig=kubeconfig apply -f k8s/ --validate=false

      - name: Wait for Heart API pods
        run: |
          kubectl --kubeconfig=kubeconfig wait \
          --for=condition=ready pod \
          -l app=heart-api \
          --timeout=180s

      - name: Wait for Prometheus & Grafana
        run: |
          kubectl --kubeconfig=kubeconfig wait --for=condition=available deployment/prometheus -n monitoring --timeout=180s
          kubectl --kubeconfig=kubeconfig wait --for=condition=available deployment/grafana -n monitoring --timeout=180s

# ---------------- PORT FORWARD ----------------
      - name: Port-forward Heart API
        run: |
          kubectl --kubeconfig=kubeconfig port-forward svc/heart-api-service 8000:80 &
          sleep 15

      - name: Verify /health on AKS
        run: curl -f http://localhost:8000/health

      - name: Verify /metrics on AKS
        run: curl -f http://localhost:8000/metrics | grep http_requests_total

      - name: Verify /predict on AKS
        run: |
          curl -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"instances": [[60,1,3,130,250,0,1,150,0,1.2,2,0,2]]}'

# ---------------- PROMETHEUS ----------------
      - name: Port-forward Prometheus
        run: |
          kubectl --kubeconfig=kubeconfig -n monitoring port-forward svc/prometheus 9090:9090 &
          sleep 10

      - name: Verify Prometheus is scraping
        run: curl -s http://localhost:9090/metrics | grep prometheus_http_requests_total

# ---------------- GRAFANA ----------------
      - name: Grafana Access Info
        run: |
          echo "Grafana URL: http://<EXTERNAL-IP>"
          echo "Username: admin"
          echo "Password: admin123"
