name: CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ✅ CRITICAL: Install ALL dependencies first
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # ✅ Lint only AFTER deps are installed
      - name: Run linting
        run: |
          flake8 src tests --config .flake8
          black --check src tests

      # ✅ Pytest runs AFTER deps (mlflow now available)
      - name: Run tests
        run: |
          pytest tests/

      # ✅ Optional: training as CI smoke-test
      - name: Train model (CI validation)
        run: |
          python src/train.py
