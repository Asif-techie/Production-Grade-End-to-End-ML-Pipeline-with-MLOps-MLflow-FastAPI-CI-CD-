name: CI - ML Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  ml-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.9", "3.10" ]

    steps:
    # 1️⃣ Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 3️⃣ Cache dependencies
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5️⃣ Linting (code quality gate)
    - name: Lint code
      run: |
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --exit-zero --max-line-length=120 --statistics

    # 6️⃣ Unit tests (data + model)
    - name: Run unit tests
      env:
        MLFLOW_TRACKING_URI: file:///tmp/mlruns
      run: |
        pytest -v

    # 7️⃣ Model training
    - name: Train model
      env:
        MLFLOW_TRACKING_URI: file:///tmp/mlruns
      run: |
        python src/train.py

    # 8️⃣ Upload artifacts (model + logs)
    - name: Upload ML artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ml-artifacts-${{ matrix.python-version }}
        path: |
          models/
          mlruns/
          **/*.log
