name: CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 5️⃣ Linting (code quality gate)
      - name: Run linting
        run: |
          flake8 src tests
          black --check src tests

      # 6️⃣ Run unit tests
      - name: Run tests
        run: |
          pytest tests/

      # 7️⃣ CI model training smoke test
      - name: Train model (CI validation)
        run: |
          python src/train.py
