name: AKS Deploy - Heart Disease API

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "k8s/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout code
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣ Install kubectl
      # -------------------------------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      # -------------------------------------------------
      # 3️⃣ Create kubeconfig file (BASE64)
      # -------------------------------------------------
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.AKS_KUBECONFIG }}" | base64 -d > kubeconfig
          chmod 600 kubeconfig
          ls -l kubeconfig

      # -------------------------------------------------
      # 4️⃣ Validate kubeconfig & set context (CRITICAL)
      # -------------------------------------------------
      - name: Set AKS context
        run: |
          kubectl --kubeconfig=$PWD/kubeconfig config get-contexts
          CONTEXT=$(kubectl --kubeconfig=$PWD/kubeconfig config get-contexts -o name | head -n 1)
          echo "Using context: $CONTEXT"
          kubectl --kubeconfig=$PWD/kubeconfig config use-context $CONTEXT

      # -------------------------------------------------
      # 5️⃣ Verify cluster access (NO localhost)
      # -------------------------------------------------
      - name: Verify cluster connection
        run: |
          kubectl --kubeconfig=$PWD/kubeconfig cluster-info
          kubectl --kubeconfig=$PWD/kubeconfig get nodes

      # -------------------------------------------------
      # 6️⃣ Deploy to AKS
      # -------------------------------------------------
      - name: Deploy application
        run: |
          kubectl --kubeconfig=$PWD/kubeconfig apply -f k8s/ --validate=false
          kubectl --kubeconfig=$PWD/kubeconfig rollout status deployment/heart-api --timeout=180s

      # -------------------------------------------------
      # 7️⃣ Post-deploy verification
      # -------------------------------------------------
      - name: Post-deploy status
        run: |
          kubectl --kubeconfig=$PWD/kubeconfig get pods
          kubectl --kubeconfig=$PWD/kubeconfig get svc
